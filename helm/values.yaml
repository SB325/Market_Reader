tolerations: []
podSecurityContext: {}
securityContext: {}

resources: &common-resources
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 10Gi
    cpu: 1

common-generic-stuff: &common-generic-config
  releaseTrunc: 45
  prefixTrunc: 51
  template: true
  replicaCount: 1
  initContainers: {}
  nodeSelector: {}
  affinity: {}

# createStorageClass: false

# Persistent Volumes
usePVCs: true
storageClassName: local-path
persistentVolumes:
  postgres-main:
    pvcname: marketreader-postgres-main-claim
    pvname: marketreader-postgres-main
    path: /mnt/bulkStorage/postgres
    storage: 150Gi
  redis-main:
    pvcname: marketreader-redis-main-claim
    pvname: marketreader-redis-main
    path: /mnt/bulkStorage/redis
    accessModes:
    - ReadWriteMany
    storage: 10Gi
  loki-data:
    pvcname: marketreader-loki-data-claim
    pvname: marketreader-loki-data
    path: /mnt/bulkStorage/loki
    storage: 10Gi
  tempo-data:
    pvcname: marketreader-tempo-data-claim
    pvname: marketreader-tempo-data
    path: /mnt/bulkStorage/tempo
    storage: 10Gi
  prometheus-data:
    pvcname: marketreader-prometheus-data-claim
    pvname: marketreader-prometheus-data
    path: /mnt/bulkStorage/prometheus
    storage: 10Gi
  pyroscope-data:
    pvcname: marketreader-pyroscope-data-claim
    pvname: marketreader-pyroscope-data
    path: /mnt/bulkStorage/pyroscope
    storage: 10Gi
  otel-data:
    pvcname: marketreader-otel-data-claim
    pvname: marketreader-otel-data
    path: (set-from-helm-install-argument)  
    storage: 10Gi

kafka:
  replicaCount: 1
  # KRaft mode configuration (no Zookeeper)
  controllerReplicaCount: 1
  configuration:
    offsetsTopicReplicationFactor: 1
    transactionStateLogReplicationFactor: 1
    transactionStateLogMinIsr: 1
    numPartitions: 1
    groupInitialRebalanceDelayMs: 0
  startupProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
    successThreshold: 1
  livenessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

redis:
  architecture: replication
  replicaCount: 1 # 1 master + 1 replicas
  master:
    persistence:
      enabled: true
      existingClaim: marketreader-redis-main-claim
  master:
    podAntiAffinityPreset: soft
  replica:
    podAntiAffinityPreset: soft
  sentinel:
    enabled: false
  auth:
    enabled: false

postgres:
  architecture: replication
  readReplicas:
    replicaCount: 0 # No read replicas for now
  auth:
    existingSecret: "postgres-credentials"
  
  primary:
    persistence:
      enabled: true
      existingClaim: marketreader-postgres-main-claim
  
  # Consolidated configuration using the chart's native config block
  config: 
    postgresqlMaxConnections: 100
    postgresqlSharedBuffers: "2.5GB"
    postgresqlEffectiveCacheSize: "6GB"
    postgresqlWorkMem: "64MB"
    postgresqlMaintenanceWorkMem: "1GB"
    postgresqlWalBuffers: "32MB"
    postgresqlCheckpointCompletionTarget: "0.9"
    postgresqlRandomPageCost: "1.0"
  
  # extraConfig is perfect for raw parameter additions
  extraConfig:
  - "wal_level = replica"
  - "max_wal_senders = 3"
  - "archive_mode = on"
  - "archive_command = 'test ! -f /mnt/bulkStorage/postgres/wal_archive/%f && mkdir -p /mnt/bulkStorage/postgres/wal_archive && cp %p /mnt/bulkStorage/postgres/wal_archive/%f'"

  resources:
    requests:
      memory: "10Gi"
      cpu: "4"
    limits:
      memory: "10Gi"
      cpu: "4"

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - postgres
            topologyKey: kubernetes.io/hostname

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Observability & Telemetry
kubernetes-dashboard:
  metricsScraper:
    enabled: true
    volumeMounts:
      - mountPath: /tmp
        name: tmp-volume
    containers:
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
        limits:
          cpu: 250m
          memory: 400Mi
      livenessProbe:
        httpGet:
          scheme: HTTP
          path: /
          port: 8000
        initialDelaySeconds: 30
        timeoutSeconds: 30

otel:
  mode: daemonset
  replicaCount: 1
  clusterMetrics:   #requires the Kubernetes Cluster reciever to be included in the collector
    enabled: false   #and requires statefulset or deployment mode with a single replica.
  kubernetesEvents: #requires the Kubernetes Objects reciever to be included in the collector
    enabled: false
  hostMetrics:    # Requires hostMetrics reciever to be included in collector
    enabled: false
  config:
    exporters:
      otlphttp:
        # endpoint: https://example.com:55681 # activate this once grafana is configured
    receivers:
      jaeger: null
      prometheus: null # activate this once prometheus is configured
      zipkin: null
    service:
      pipelines:
        traces:
          receivers:
            - otlp
        metrics: 
          receivers:
            - otlp
        logs: 
          receivers:
            - otlp
          exporters:
            - otlphttp

prometheus: 
  enabled: true
  # Persistent Volume Claim configuration
  server:
    persistentVolume:
      enabled: true
      existingClaim: marketreader-prometheus-data-claim

tempo:
  replicas: 1
  # Persistent Volume Claim configuration
  persistence:
    enabled: true
    existingClaim: marketreader-tempo-data-claim
  metricsGenerator:
    # -- If true, enables Tempo's metrics generator (https://grafana.com/docs/tempo/next/metrics-generator/)
    enabled: false
    storage:
      # -- Path for storing metrics blocks. Defaults to /tmp/tempo for backward compatibility, but /var/tempo/metrics is recommended for production with persistent storage
      path: "/tmp/tempo"
      # -- Optional remote write configuration (will use remoteWriteUrl if not specified)
      # Supports full Prometheus remote_write config: https://prometheus.io/docs/prometheus/latest/configuration/configuration/#remote_write
      remote_write: []
    # -- Traces storage (WAL) configuration for metrics generator
    # This configures the Write Ahead Log for traces used by the metrics generator
    traces_storage:
      # -- Path for traces storage WAL used by metrics generator
      path: "/tmp/traces"
  retention: 24h
  livenessProbe:
    httpGet:
      path: /ready
      port: 3200
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    httpGet:
      path: /ready
      port: 3200
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

loki:
  auth_enabled: false
  # Persistent Volume Claim configuration
  persistence:
    enabled: true
    existingClaim: marketreader-loki-data-claim
  # Configures the liveness probe for all of the Loki pods
  livenessProbe: {}
  # Configures the readiness probe for all of the Loki pods
  readinessProbe:
    httpGet:
      path: /ready
      port: http-metrics
    periodSeconds: 10
    initialDelaySeconds: 15
    successThreshold: 1
    failureThreshold: 3
    timeoutSeconds: 1
  storage:
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

grafana:
  replicas: 1
  autoscaling:
    enabled: false

  ingress:
    enabled: true
    ingressClassName: nginx  # or your ingress class
    annotations:
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: hostname-secret
      nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
    hosts:
      - (set-from-helm-install-argument)  
    tls:
      - secretName: tls-secrets
        hosts:
          - (set-from-helm-install-argument)
          
  readinessProbe:
  httpGet:
    path: /api/health
    port: grafana 
  livenessProbe:
    httpGet:
      path: /api/health
      port: grafana 
    initialDelaySeconds: 60
    timeoutSeconds: 30
    failureThreshold: 10

pyroscope:
  replicas: 1
  retention: 24h
  # Persistent Volume Claim configuration
  persistence:
    enabled: true
    existingClaim: marketreader-pyroscope-data-claim
  storage:
    path: /var/lib/pyroscope

# Main Application
marketreader:
  metadata:
    enabled: true
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    # privileged: true
  ingress:
    enabled: true
    hostGroups:
      host1:
        tls:
          enabled: true
          secretName: 'tls-secrets'
        hosts:
        - secretRef:
            name: hostname-secret 
        paths:
        - path: /pgadmin
          pathType: Prefix
          serviceName: pgadmin-service
          servicePort: (set-from-helm-install-argument)
        - path: /grafana
          pathType: Prefix
          serviceName: grafana
          servicePort: 3000
  serviceAccount:
    create: true
    name: default
  services:
    extract_facts_filings:
      enabled: true
      ingress:
        enabled: false
      <<: *common-generic-config
      containers:
        extract_facts_filings:
          resources:
            <<: *common-resources
          env:
            FILING_TYPE:
              value: 'facts'
            OTEL_EXPORTER_OTLP_ENDPOINT:
              value: 'http://otel:4318'
          image:
            registry: ""
            repository: homeserver-extract_facts_filings
            tag: latest
    extract_submissions_filings:
      enabled: true
      ingress:
        enabled: false
      <<: *common-generic-config
      containers:
        extract_facts_filings:
          resources:
            <<: *common-resources
          env:
            FILING_TYPE:
              value: 'submissions'
            OTEL_EXPORTER_OTLP_ENDPOINT:
              value: 'http://otel:4318'
          image:
            registry: ""
            repository: homeserver-extract_submissions_filings
            tag: latest
    load_submissions_filings:
      enabled: true
      ingress:
        enabled: false
      <<: *common-generic-config
      containers:
        load_submissions_filings:
          resources:
            <<: *common-resources
          env:
            FILING_TYPE:
              value: 'submissions'
            OTEL_EXPORTER_OTLP_ENDPOINT:
              value: 'http://otel:4318'
          image:
            registry: ""
            repository: homeserver-tl_submissions_filings
            tag: latest
    load_facts_filings:
      enabled: true
      ingress:
        enabled: false
      <<: *common-generic-config
      containers:
        load_facts_filings:
          resources:
            <<: *common-resources
          env:
            FILING_TYPE:
              value: 'facts'
            OTEL_EXPORTER_OTLP_ENDPOINT:
              value: 'http://otel:4318'
          image:
            registry: ""
            repository: homeserver-tl_facts_filings
            tag: latest
    pgadmin-service:
      enabled: true
      ingress:
        enabled: true
      <<: *common-generic-config
      service:
        type: ClusterIP
        servicePort: 80
        ports:
          - name: http
            port: 80
            protocol: TCP
            targetPort: (set-from-helm-install-argument)
      containers:
        pgadmin:
          resources:
            <<: *common-resources
          env:
            environment:
              PGADMIN_EMAIL:
                valueFrom:
                  secretKeyRef:
                    name: pgadmin-credentials
                    key: pgadmin_email
              PGADMIN_PW:
                valueFrom:
                  secretKeyRef:
                    name: pgadmin-credentials
                    key: pgadmin_pw   
            FILING_TYPE:
              value: 'facts'
          image:
            registry: ""
            repository: dpage/pgadmin4
            tag: 8.0